name: faceMap desktop

on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/pyproject.toml
      - name: Install desktop package
        run: python -m pip install --only-binary=":all:" ./desktop pyinstaller
      - name: Check CPU dependencies
        run: python -m facemap_desktop --doctor
      - name: Test archive import, reconstruction and local viewer
        run: python -m unittest discover -s desktop/tests -v
      - name: Build desktop executable
        working-directory: desktop
        run: python -m PyInstaller --noconfirm --onedir --console --name faceMap-Desktop --collect-all facemap_desktop --collect-all open3d --collect-all scipy --collect-all sklearn --collect-all av --collect-all pycolmap --collect-data cv2 --copy-metadata numpy --copy-metadata scipy --copy-metadata Pillow --copy-metadata trimesh frozen_entry.py
      - name: Test packaged executable on Windows
        if: runner.os == 'Windows'
        run: |
          desktop/dist/faceMap-Desktop/faceMap-Desktop.exe --doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          desktop/dist/faceMap-Desktop/faceMap-Desktop.exe --self-test --output packaged-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          desktop/dist/faceMap-Desktop/faceMap-Desktop.exe --self-test-video --output packaged-video-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          desktop/dist/faceMap-Desktop/faceMap-Desktop.exe --self-test-rgbd --output packaged-rgbd-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          desktop/dist/faceMap-Desktop/faceMap-Desktop.exe --gui-self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test packaged executable on Mac and Linux
        if: runner.os != 'Windows'
        run: |
          desktop/dist/faceMap-Desktop/faceMap-Desktop --doctor
          desktop/dist/faceMap-Desktop/faceMap-Desktop --self-test --output packaged-smoke
          desktop/dist/faceMap-Desktop/faceMap-Desktop --self-test-video --output packaged-video-smoke
          desktop/dist/faceMap-Desktop/faceMap-Desktop --self-test-rgbd --output packaged-rgbd-smoke
      - name: Test packaged desktop window on Mac
        if: runner.os == 'macOS'
        run: desktop/dist/faceMap-Desktop/faceMap-Desktop --gui-self-test
      - name: Test packaged desktop window on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a desktop/dist/faceMap-Desktop/faceMap-Desktop --gui-self-test
      - name: Archive runnable package with file permissions
        run: python desktop/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: faceMap-Desktop-${{ matrix.os }}
          path: desktop/release/*
          if-no-files-found: error
